# EEGNet-Mid transfer (~1.9M params).
# Fine-tunes from cross-subject EEGNet-Mid checkpoint.
# See configs/eegnet_mid_cross.yaml header for context.
model:
  name: EEGNet-Mid
  F1: 32
  D: 4
  F2: 256
  kernel_length: 64
  dropout_rate: 0.4
  mlp_hidden_dims: [1024, 1024]

training:
  scheduler: cosine_annealing_warmup_decay
  epochs: 500
  batch_size: 64
  learning_rate: 5.0e-4
  weight_decay: 0.03
  label_smoothing: 0.05
  gradient_clip: 1.0

scheduler_config:
  phase_epochs: 10
  phase_decay: 0.5
  lr_ramp_ratio: 0.2
  eta_min: 1.0e-6
  exploration_epochs: 4
  exploration_batch_size: 32
