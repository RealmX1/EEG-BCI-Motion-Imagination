# EEGNet-Huge cross-subject ablation (v3, ~5.84M params, 361× EEGNet baseline).
#
# v1 (LR=5e-5, [4096,4096], no LN) — failed to converge
# v2 (LR=5e-4, [5120,5120], no LN) — failed to converge (same 50% across all subjects)
# v3 (LR=8e-4, [2048,2048], + LayerNorm) — narrows MLP to make it trainable while
#   keeping params 2 orders of magnitude above EEGNet baseline. LayerNorm stabilizes
#   gradient flow through the deep MLP head in BF16 mixed precision.
#
# Architecture spec: docs/handoffs/2026-05-09_eegnet_huge.md
model:
  name: EEGNet-Huge-v3
  F1: 32
  D: 4
  F2: 256
  kernel_length: 64
  dropout_rate: 0.4
  mlp_hidden_dims: [2048, 2048]   # 5.84M total — 19% of CBraMod 30.5M, 361× EEGNet baseline

training:
  scheduler: cosine_annealing_warmup_decay
  epochs: 500
  batch_size: 64
  learning_rate: 8.0e-4           # v3: peak LR closer to baseline EEGNet's 4e-3
  weight_decay: 0.05
  label_smoothing: 0.05
  gradient_clip: 1.0

scheduler_config:
  phase_epochs: 15
  phase_decay: 0.5
  lr_ramp_ratio: 0.3
  eta_min: 1.0e-6
  exploration_epochs: 6
  exploration_batch_size: 32
