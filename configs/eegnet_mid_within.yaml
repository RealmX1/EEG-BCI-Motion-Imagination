# EEGNet-Mid within-subject (~1.9M params).
# Same as v3 within HP, MLP narrowed [2048,2048] → [1024,1024] for the
# capacity-curve datapoint. See configs/eegnet_mid_cross.yaml header for context.
model:
  name: EEGNet-Mid
  F1: 32
  D: 4
  F2: 256
  kernel_length: 64
  dropout_rate: 0.4
  mlp_hidden_dims: [1024, 1024]

training:
  scheduler: cosine_annealing_warmup_decay
  epochs: 500
  batch_size: 64
  learning_rate: 1.5e-3
  weight_decay: 0.03
  label_smoothing: 0.05
  gradient_clip: 1.0

scheduler_config:
  phase_epochs: 12
  phase_decay: 0.5
  lr_ramp_ratio: 0.3
  eta_min: 1.0e-6
  exploration_epochs: 5
  exploration_batch_size: 32
